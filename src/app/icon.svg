<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c74ff"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px tile with ~185px corners inside the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- back sheet with tab -->
    <path d="M250 330 q0-40 40-40 h150 q22 0 36 16 l34 38 h224 q40 0 40 40 v300 q0 40-40 40 H290 q-40 0-40-40 Z" fill="url(#back)"/>
    <!-- front sheet -->
    <rect x="250" y="410" width="524" height="340" rx="40" fill="url(#front)"/>
  </g>
  <!-- three rows: the list view -->
  <rect x="320" y="485" width="230" height="30" rx="15" fill="#6366f1"/>
  <rect x="320" y="560" width="330" height="30" rx="15" fill="#a5b4fc"/>
  <rect x="320" y="635" width="270" height="30" rx="15" fill="#a5b4fc"/>
  <circle cx="690" cy="500" r="26" fill="#f59e0b"/>
</svg>
